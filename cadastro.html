
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SAEPVision</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/cadastro.js" defer></script>
</head>

<body>

    <header class="cabecalho">

        <div class="logo">
            <h1>SAEP<span>Vision</span></h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="publicacoes.html">Publicações</a>
            <a href="login.html">Entrar</a>
        </nav>

    </header>

    <main class="pagina-cadastro">

        <section class="caixa-cadastro">

            <h2>Criar uma conta</h2>

            <p>Faça seu cadastro no SAEPVision.</p>

            <form id="formCadastro">

                <label for="nome">Nome completo:</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome completo"
                    required
                >

                <label for="email">E-mail:</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha:</label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                >

                <label for="tipo">Tipo de conta:</label>

                <select id="tipo" required>

                    <option value="">Selecione uma opção</option>

                    <option value="usuario">
                        Usuário comum
                    </option>

                    <option value="fotografo">
                        Fotógrafo
                    </option>

                </select>

                <p id="mensagemCadastro"></p>

                <button type="submit" class="btn-principal">
                    Cadastrar
                </button>

            </form>

            <p class="link-login">
                Já possui uma conta?
                <a href="login.html">Faça login</a>
            </p>

            <a href="index.html" class="voltar">
                Voltar para o início
            </a>

        </section>

    </main>

    <footer>

        <h3>SAEPVision</h3>

        <p>Compartilhando momentos através da fotografia.</p>

        <p>© 2026 SAEPVision</p>

    </footer>

</body>
</html>
