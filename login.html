
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SAEPVision</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/login.js" defer></script>
</head>

<body>

    <header class="cabecalho">
        <div class="logo">
            <h1>SAEP<span>Vision</span></h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="publicacoes.html">Publicações</a>
            <a href="cadastro.html">Cadastrar</a>
        </nav>
    </header>

    <main class="pagina-login">

        <section class="caixa-login">

            <h2>Entrar na sua conta</h2>

            <p>Acesse sua conta SAEPVision.</p>

            <form id="formLogin">

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <p id="mensagemLogin"></p>

                <button type="submit" class="btn-principal">
                    Entrar
                </button>

            </form>

            <p class="link-cadastro">
                Ainda não tem uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

            <a href="index.html" class="voltar">
                Voltar para o início
            </a>

        </section>

    </main>

    <footer>
        <h3>SAEPVision</h3>
        <p>Compartilhando momentos através da fotografia.</p>
        <p>© 2026 SAEPVision</p>
    </footer>

</body>
</html>
